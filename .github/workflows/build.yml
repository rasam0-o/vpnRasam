name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name rasam --org com.rasam .
      - name: Add native DNS code
        run: |
          D=$(dirname "$(find android/app/src/main/kotlin -name MainActivity.kt)")
          rm "$D/MainActivity.kt"
          cp native/Native.kt "$D/Native.kt"
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application',1)
          svc='<service android:name=".DnsVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false"><intent-filter><action android:name="android.net.VpnService"/></intent-filter></service>\n    </application>'
          s=s.replace('</application>',svc,1)
          s=re.sub(r'android:label="[^"]*"','android:label="Rasam"',s)
          open(p,'w').write(s)
          PY
      - name: Generate app icon
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os, glob

          RES = 'android/app/src/main/res'
          EMERALD = (16, 185, 129, 255)
          BG = (11, 13, 14, 255)

          def font(px):
              for p in glob.glob('/usr/share/fonts/**/DejaVuSans-Bold.ttf', recursive=True):
                  return ImageFont.truetype(p, px)
              return ImageFont.load_default(px)

          def art(n, opaque, box):
              S = n * 4
              im = Image.new('RGBA', (S, S), BG if opaque else (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              m = int(S * (1 - box) / 2)
              d.rounded_rectangle([m, m, S - m, S - m], radius=int(S * box * 0.26), outline=EMERALD, width=max(2, int(S * box * 0.05)))
              d.text((S / 2, S / 2), 'R', font=font(int(S * box * 0.62)), fill=EMERALD, anchor='mm')
              return im.resize((n, n), Image.LANCZOS)

          # 1) legacy icons (all densities)
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for k, n in sizes.items():
              p = RES + '/mipmap-%s/ic_launcher.png' % k
              if os.path.exists(p):
                  art(n, True, 0.72).save(p)

          # 2) adaptive icon (Android 8+), replaces any adaptive icon the template made
          for f in glob.glob(RES + '/mipmap-anydpi*/ic_launcher*.xml'):
              os.remove(f)
          os.makedirs(RES + '/mipmap-anydpi-v26', exist_ok=True)
          os.makedirs(RES + '/drawable-nodpi', exist_ok=True)
          os.makedirs(RES + '/values', exist_ok=True)
          art(432, False, 0.56).save(RES + '/drawable-nodpi/rasam_icon_fg.png')
          open(RES + '/values/rasam_icon.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="rasam_icon_bg">#0B0D0E</color>\n</resources>\n')
          open(RES + '/mipmap-anydpi-v26/ic_launcher.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/rasam_icon_bg"/>\n    <foreground android:drawable="@drawable/rasam_icon_fg"/>\n</adaptive-icon>\n')
          print('icons written')
          PY
      - name: Generate sound effects
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import wave, struct, math, os

          OUT = 'android/app/src/main/res/raw'
          os.makedirs(OUT, exist_ok=True)
          SR = 22050

          def write(name, samples):
              with wave.open('%s/sfx_%s.wav' % (OUT, name), 'wb') as w:
                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(SR)
                  w.writeframes(b''.join(struct.pack('<h', max(-32767, min(32767, int(s * 32767)))) for s in samples))

          def tone(freq, dur, vol=0.5, decay=6.0, harm=0.0):
              n = int(SR * dur)
              out = []
              for i in range(n):
                  t = i / SR
                  env = math.exp(-decay * i / n) * min(1.0, i / (SR * 0.003)) * min(1.0, (n - i) / (SR * 0.006))
                  v = math.sin(2 * math.pi * freq * t) + harm * math.sin(2 * math.pi * freq * 2 * t)
                  out.append(v * env * vol / (1 + harm))
              return out

          def seq(parts):
              out = []
              for p in parts:
                  out += p
              return out

          write('click', tone(1800, 0.035, 0.5, 5))
          write('connect', seq([tone(523, 0.11, 0.6, 3, 0.3), tone(659, 0.11, 0.6, 3, 0.3), tone(784, 0.11, 0.6, 3, 0.3), tone(1047, 0.30, 0.6, 4, 0.3)]))
          write('disconnect', seq([tone(784, 0.10, 0.6, 3, 0.3), tone(587, 0.10, 0.6, 3, 0.3), tone(392, 0.26, 0.6, 4, 0.3)]))
          write('error', seq([tone(220, 0.14, 0.6, 2, 0.5), [0.0] * int(SR * 0.04), tone(196, 0.22, 0.6, 3, 0.5)]))
          open(OUT + '/keep.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@raw/sfx_*" />\n')
          print('sounds written')
          PY
      - name: Set minSdk
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*
      - run: flutter pub get
      - run: flutter build apk --release --no-shrink --build-number=${{ github.run_number }}
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/unsigned.apk
          if [ -z "$KS_B64" ]; then
            echo "No keystore secret found, keeping the default signature"
            mv out/unsigned.apk out/rasam.apk
            exit 0
          fi
          echo "$KS_B64" | base64 -d > rasam.jks
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks rasam.jks --ks-key-alias rasam --ks-pass env:KS_PASS --key-pass env:KS_PASS --out out/rasam.apk out/unsigned.apk
          "$APKSIGNER" verify --print-certs out/rasam.apk
          rm out/unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rasam-apk
          path: out/rasam.apk
